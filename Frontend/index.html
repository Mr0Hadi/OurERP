<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-black-transparent.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-transparent.png"
      media="(prefers-color-scheme: dark)"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-black-transparent.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-transparent.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="سامانه انبارداری و مدیریت لوازم یدکی خودرو OurERP"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OurERP" />
    <title>OurERP</title>
    <script>
      // تم را پیش از اولین رنگ‌آمیزی اعمال می‌کند تا بین بارگذاریِ صفحه و
      // سوار شدنِ React پس‌زمینه‌ی اشتباه (سیاه) دیده نشود. منطقِ اصلی در
      // ThemeProvider است؛ پیش‌فرض و کلید باید با آنجا یکی بماند.
      (function () {
        try {
          var t = localStorage.getItem("vite-ui-theme") || "dark";
          if (t === "system") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          // منطقِ کامل: shared/components/theme/themeClasses.js
          var c = t === "material-light" ? ["theme-material", "light"]
            : t === "material-dark" ? ["theme-material", "dark"]
            : t === "classic" ? ["theme-classic"] : [t];
          document.documentElement.classList.add.apply(document.documentElement.classList, c);
        } catch (e) {}
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf8;
        transition: opacity 0.2s;
      }
      html.dark #app-splash { background: #0a0a0a; }
      /* هم‌رنگ با --background تمِ Material (material.css) */
      html.theme-material #app-splash { background: #f8fafd; }
      html.theme-material.dark #app-splash { background: #131314; }
      html.theme-material #app-splash i { border-color: rgba(11, 87, 208, 0.25); border-top-color: #0b57d0; }
      html.theme-material.dark #app-splash i { border-color: rgba(168, 199, 250, 0.25); border-top-color: #a8c7fa; }
      /* تمِ کلاسیک: زمینه‌ی ButtonFace و حلقه‌ی آبیِ «مشغول»ِ ویندوز ۷ (classic.css) */
      html.theme-classic #app-splash { background: #f0f0f0; }
      html.theme-classic #app-splash i {
        border: 0;
        width: 32px;
        height: 32px;
        background: conic-gradient(from 0deg, transparent 0 20%, #9fd3f8, #1c7fd8 95%, transparent);
        -webkit-mask: radial-gradient(circle, transparent 9px, #000 10px);
        mask: radial-gradient(circle, transparent 9px, #000 10px);
        animation: app-splash-spin 0.9s linear infinite;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      #app-splash i {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(79, 70, 229, 0.25);
        border-top-color: #4f46e5;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-splash"><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
